config_version: 1

nine_router:
  base_url: http://127.0.0.1:20128/v1
  api_key_env: NINE_ROUTER_API_KEY
  rank_model: ollama/gpt-oss:120b
  rank_models:
    - ollama/gpt-oss:120b
    - bai-auto/deepseek-v4-flash
    - opencode/muse-spark-1.3-contributor-free
  max_tokens: 6000
  timeout_s: 300
  temperature: 0.0
  seed: 42

groq:
  api_key_env: GROQ_API_KEY
  model: whisper-large-v3-turbo

transcribe:
  primary: groq
  fallback: local
  local_model: small
  local_compute: int8

download:
  max_duration_s: 5400
  format: "bv*[height<=720]+ba/b[height<=720]/b"

prefilter:
  min_clip_s: 20
  max_clip_s: 70
  max_candidates: 20
  skip_intro_outro_s: 30

clips:
  default_style: hormozi
  max_clips: 3
  width: 1080
  height: 1920
  sidecars: ["ass", "srt", "vtt"]
  layout: auto
  fit_ratio: 2.0
  fit_blur_sigma: 25
  fit_brightness: -0.18
  loudnorm: false
  trim_silence: false
  smart_crop: false
  smart_crop_samples: 8
  smart_crop_thresh: 0.5
  follow_speaker: false
  scene_thresh: 0.15
  follow_fps: 2
  follow_min_dwell: 1.5

paths:
  work_dir: work
  output_dir: output
